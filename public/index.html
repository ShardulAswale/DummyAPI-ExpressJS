<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Swagger Documentation</title>
    <!-- Include Swagger UI CSS -->
    <link rel="stylesheet" type="text/css" href="https://cdnjs.cloudflare.com/ajax/libs/swagger-ui/4.2.0/swagger-ui.min.css">
    <!-- Override styles if needed -->
    <style>
        /* Add any custom styles here */
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
    </style>
</head>
<body>
    <!-- Embed Swagger UI -->
    <div id="swagger-ui"></div>

    <!-- Include Swagger UI JavaScript -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/swagger-ui/4.2.0/swagger-ui-bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/swagger-ui/4.2.0/swagger-ui-standalone-preset.min.js"></script>
    <script>
        window.onload = function() {
            // Load Swagger UI
            const ui = SwaggerUIBundle({
                url: "/api-docs", // URL to your Swagger JSON file
                dom_id: '#swagger-ui',
                presets: [
                    SwaggerUIBundle.presets.apis,
                    SwaggerUIBundle.SwaggerUIStandalonePreset
                ],
                layout: "BaseLayout"
            });

            // Set title
            document.querySelector("title").innerText = "Swagger Documentation";
        }
    </script>
</body>
</html>
